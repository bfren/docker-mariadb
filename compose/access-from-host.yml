services:
  db:
    image: bfren/mariadb:mariadb${VERSION}
    container_name: db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT}:3306"
    environment:
      - BF_DB_ROOT_PASSWORD=${ROOT_PASSWORD}
      - BF_DB_APPLICATION=${APPLICATION}
      - BF_DB_PASSWORD=${PASSWORD}
    volumes:
      - ./v/data:/data
      - ./v/backup:/backup
