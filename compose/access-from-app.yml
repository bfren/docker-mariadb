services:
  db:
    image: bfren/mariadb:mariadb${VERSION}
    container_name: db
    restart: unless-stopped
    environment:
      - BF_DB_ROOT_PASSWORD=${ROOT_PASSWORD}
      - BF_DB_APPLICATION=${APPLICATION}
      - BF_DB_PASSWORD=${PASSWORD}
    volumes:
      - ./v/data:/data
      - ./v/backup:/backup
    networks:
      - app

  # add your app here, on the app network, and connect to db:3306

networks:
  app:
    name: app
